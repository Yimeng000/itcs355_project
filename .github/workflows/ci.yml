name: Project CI and CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project tools
        run: python -m pip install -r requirements-dev.txt

      - name: Check portability, credentials and tests
        run: make check

  reproduce:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    env:
      GOOGLE_CLOUD_PROJECT: itcs355-6688176
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training and checking tools
        run: python -m pip install -r requirements-training.txt -r requirements-dev.txt

      - name: Authenticate for private dataset and model retrieval
        uses: google-github-actions/auth@v3
        with:
          project_id: itcs355-6688176
          workload_identity_provider: projects/259177885839/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@itcs355-6688176.iam.gserviceaccount.com

      - name: Retrieve tracked raw data and reference model
        run: |
          python -m dvc pull data/taxi_trip_pricing.csv.dvc
          mkdir -p reports/ci
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          receipt = json.loads(Path("reports/registration.json").read_text())
          from urllib.parse import urlsplit
          from google.cloud import storage

          uri = receipt["artifact_uri"].rstrip("/") + "/model.joblib"
          location = urlsplit(uri)
          if location.scheme != "gs" or not location.netloc:
              raise ValueError("Invalid registered artifact URI")
          client = storage.Client()
          client.bucket(location.netloc).blob(
              location.path.lstrip("/")
          ).download_to_filename("reports/ci/reference.joblib")
          actual = hashlib.sha256(
              Path("reports/ci/reference.joblib").read_bytes()
          ).hexdigest()
          if actual != receipt["lineage"]["model_sha256"]:
              raise RuntimeError("DVC reference does not match the registered model")
          print("Registered reference model downloaded and verified")
          PY

      - name: Reproduce data checks, training and evaluation
        run: python -m dvc repro --force

      - name: Compare retrained candidate with registered reference
        run: |
          python -m src.compare_models             --reference reports/ci/reference.joblib             --candidate models/model.joblib             --validation data/processed/val.csv             --receipt reports/registration.json             --training-record reports/train_metrics.json             --output reports/ci/comparison.json

      - name: Verify registration checks without uploading
        run: |
          python -m src.register             --comparison-report reports/ci/comparison.json             --reference-model reports/ci/reference.joblib             --dry-run

      - name: Save pipeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-${{ github.sha }}
          if-no-files-found: warn
          path: |
            reports/data_quality.json
            data/processed/clean_report.json
            data/processed/split_report.json
            reports/train_metrics.json
            reports/metrics.json
            reports/model_lineage.json
            reports/ci/comparison.json
            dvc.lock

  deploy:
    needs: [test, reproduce]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    concurrency:
      group: taxi-production-deployment
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    env:
      CLOUD_PROVIDER: gcp
      PROJECT_ID: itcs355-6688176
      REGION: asia-southeast1
      IMAGE_REPOSITORY: asia-southeast1-docker.pkg.dev/itcs355-6688176/itcs355/taxi-fare
      WIF_PROVIDER: projects/259177885839/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      DEPLOY_ACCOUNT: github-actions@itcs355-6688176.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build serving image
        run: |
          docker build \
            -f service/Dockerfile.serve \
            -t "$IMAGE_REPOSITORY:$GITHUB_SHA" .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Push serving image
        id: image
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
          docker push "$IMAGE_REPOSITORY:$GITHUB_SHA"
          digest=$(gcloud artifacts docker images describe \
            "$IMAGE_REPOSITORY:$GITHUB_SHA" \
            --project="$PROJECT_ID" \
            --format="value(image_summary.digest)")
          test -n "$digest"
          echo "uri=$IMAGE_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy registered model to staging
        id: staging_deploy
        env:
          SERVING_IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          python -m cloudlayer.deploy --service=taxi-fare-staging --image="$SERVING_IMAGE"

      - name: Get staging identity token
        id: staging_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.staging_deploy.outputs.url }}
          id_token_include_email: true

      - name: Verify staging readiness, prediction and invalid input
        env:
          TAXI_URL: ${{ steps.staging_deploy.outputs.url }}
          TAXI_TOKEN: ${{ steps.staging_auth.outputs.id_token }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          def call(path, payload=None):
              headers = {
                  "Authorization": "Bearer " + os.environ["TAXI_TOKEN"],
                  "Content-Type": "application/json",
              }
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(os.environ["TAXI_URL"] + path,
                                headers=headers, data=data)
              try:
                  with urlopen(request, timeout=60) as response:
                      return response.status, json.loads(response.read())
              except HTTPError as error:
                  return error.code, json.loads(error.read())

          receipt = json.load(open("reports/registration.json"))
          version = str(receipt["version_id"])
          status, ready = call("/ready")
          assert status == 200, (status, ready)
          assert ready["model_version"] == version, ready

          payload = {
              "Trip_Distance_km": 10.0, "Passenger_Count": 2,
              "Base_Fare": 3.0, "Per_Km_Rate": 1.5,
              "Per_Minute_Rate": 0.3, "Time_of_Day": "Morning",
              "Day_of_Week": "Weekday", "Traffic_Conditions": "Low",
              "Weather": "Clear",
          }
          status, prediction = call("/predict", payload)
          assert status == 200, (status, prediction)
          assert prediction["model_version"] == version, prediction
          assert prediction["estimated_fare"] == 37.2, prediction

          payload["Trip_Distance_km"] = -5
          status, result = call("/predict", payload)
          assert status == 422, (status, result)
          print("Cloud readiness, prediction and invalid-input checks passed")
          PY

      - name: Preserve staging deployment evidence
        run: cp reports/deployment.json reports/staging-deployment.json

      - name: Save production traffic before updating
        id: production_snapshot
        run: |
          python -m cloudlayer.rollback snapshot --service=taxi-fare-api --project="$PROJECT_ID" --region="$REGION" --snapshot=reports/rollback/production-before.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          snapshot = json.loads(Path("reports/rollback/production-before.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("url=" + snapshot["service_url"] + "\n")
          PY

      - name: Deploy registered model service
        id: deploy
        env:
          SERVING_IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          python -m cloudlayer.deploy \
            --service=taxi-fare-api \
            --image="$SERVING_IMAGE"

      - name: Get identity token for service checks
        id: smoke_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}
          id_token_include_email: true

      - name: Verify cloud readiness, prediction and invalid input
        env:
          TAXI_URL: ${{ steps.deploy.outputs.url }}
          TAXI_TOKEN: ${{ steps.smoke_auth.outputs.id_token }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          def call(path, payload=None):
              headers = {
                  "Authorization": "Bearer " + os.environ["TAXI_TOKEN"],
                  "Content-Type": "application/json",
              }
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(os.environ["TAXI_URL"] + path,
                                headers=headers, data=data)
              try:
                  with urlopen(request, timeout=60) as response:
                      return response.status, json.loads(response.read())
              except HTTPError as error:
                  return error.code, json.loads(error.read())

          receipt = json.load(open("reports/registration.json"))
          version = str(receipt["version_id"])
          status, ready = call("/ready")
          assert status == 200, (status, ready)
          assert ready["model_version"] == version, ready

          payload = {
              "Trip_Distance_km": 10.0, "Passenger_Count": 2,
              "Base_Fare": 3.0, "Per_Km_Rate": 1.5,
              "Per_Minute_Rate": 0.3, "Time_of_Day": "Morning",
              "Day_of_Week": "Weekday", "Traffic_Conditions": "Low",
              "Weather": "Clear",
          }
          status, prediction = call("/predict", payload)
          assert status == 200, (status, prediction)
          assert prediction["model_version"] == version, prediction
          assert prediction["estimated_fare"] == 37.2, prediction

          payload["Trip_Distance_km"] = -5
          status, result = call("/predict", payload)
          assert status == 422, (status, result)
          print("Cloud readiness, prediction and invalid-input checks passed")
          PY

      - name: Restore production traffic after failed deployment or checks
        id: production_restore
        if: failure() && steps.production_snapshot.outcome == 'success' && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        run: |
          python -m cloudlayer.rollback restore --service=taxi-fare-api --project="$PROJECT_ID" --region="$REGION" --snapshot=reports/rollback/production-before.json --report=reports/rollback/production-restored.json

      - name: Get token to verify restored service
        id: restore_auth
        if: failure() && steps.production_restore.outcome == 'success'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.production_snapshot.outputs.url }}
          id_token_include_email: true

      - name: Verify restored API
        if: failure() && steps.production_restore.outcome == 'success' && steps.restore_auth.outcome == 'success'
        env:
          TAXI_URL: ${{ steps.production_snapshot.outputs.url }}
          TAXI_TOKEN: ${{ steps.restore_auth.outputs.id_token }}
        run: |
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          def call(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(
                  os.environ["TAXI_URL"] + path,
                  data=data,
                  headers={
                      "Authorization": "Bearer " + os.environ["TAXI_TOKEN"],
                      "Content-Type": "application/json",
                  },
              )
              with urlopen(request, timeout=60) as response:
                  assert response.status == 200
                  return json.loads(response.read())

          ready = call("/ready")
          payload = {
              "Trip_Distance_km": 10.0, "Passenger_Count": 2,
              "Base_Fare": 3.0, "Per_Km_Rate": 1.5,
              "Per_Minute_Rate": 0.3, "Time_of_Day": "Morning",
              "Day_of_Week": "Weekday", "Traffic_Conditions": "Low",
              "Weather": "Clear",
          }
          prediction = call("/predict", payload)
          fare = prediction["estimated_fare"]
          assert isinstance(fare, (int, float)) and not isinstance(fare, bool)
          assert math.isfinite(fare) and fare >= 0
          assert prediction["model_version"] == ready["model_version"]
          Path("reports/rollback/production-api-restored.json").write_text(
              json.dumps({
                  "api_checks_passed": True,
                  "ready": ready,
                  "prediction": prediction,
              }, indent=2)
          )
          print("Restored API readiness and prediction checks passed")
          PY

      - name: Save deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.sha }}
          path: |
            reports/deployment.json
            reports/staging-deployment.json
            reports/rollback/production-*.json
