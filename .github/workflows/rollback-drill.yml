name: Staging rollback drill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback_drill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: taxi-staging-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_PROVIDER: gcp
      PROJECT_ID: itcs355-6688176
      REGION: asia-southeast1
      IMAGE_REPOSITORY: asia-southeast1-docker.pkg.dev/itcs355-6688176/itcs355/taxi-fare
      WIF_PROVIDER: projects/259177885839/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      DEPLOY_ACCOUNT: github-actions@itcs355-6688176.iam.gserviceaccount.com
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ env.PROJECT_ID }}
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.DEPLOY_ACCOUNT }}
    - uses: google-github-actions/setup-gcloud@v3
    - name: Save production traffic before updating
      id: production_snapshot
      run: |
        python -m cloudlayer.rollback snapshot --service=taxi-fare-staging --project="$PROJECT_ID" --region="$REGION" --snapshot=reports/rollback/staging-auto-before.json
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        snapshot = json.loads(Path("reports/rollback/staging-auto-before.json").read_text())
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write("url=" + snapshot["service_url"] + "\n")
        PY
    - name: Get token for baseline checks
      id: baseline_auth
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ env.PROJECT_ID }}
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.DEPLOY_ACCOUNT }}
        token_format: id_token
        id_token_audience: ${{ steps.production_snapshot.outputs.url }}
        id_token_include_email: true
    - name: Verify staging is healthy before the drill
      env:
        TAXI_URL: ${{ steps.production_snapshot.outputs.url }}
        TAXI_TOKEN: ${{ steps.baseline_auth.outputs.id_token }}
      run: |
        python - <<'PY'
        import json
        import os
        from urllib.request import Request, urlopen
        from urllib.error import HTTPError

        def call(path, payload=None):
            headers = {
                "Authorization": "Bearer " + os.environ["TAXI_TOKEN"],
                "Content-Type": "application/json",
            }
            data = None if payload is None else json.dumps(payload).encode()
            request = Request(os.environ["TAXI_URL"] + path,
                              headers=headers, data=data)
            try:
                with urlopen(request, timeout=60) as response:
                    return response.status, json.loads(response.read())
            except HTTPError as error:
                return error.code, json.loads(error.read())

        receipt = json.load(open("reports/registration.json"))
        version = str(receipt["version_id"])
        status, ready = call("/ready")
        assert status == 200, (status, ready)
        assert ready["model_version"] == version, ready

        payload = {
            "Trip_Distance_km": 10.0, "Passenger_Count": 2,
            "Base_Fare": 3.0, "Per_Km_Rate": 1.5,
            "Per_Minute_Rate": 0.3, "Time_of_Day": "Morning",
            "Day_of_Week": "Weekday", "Traffic_Conditions": "Low",
            "Weather": "Clear",
        }
        status, prediction = call("/predict", payload)
        assert status == 200, (status, prediction)
        assert prediction["model_version"] == version, prediction
        assert prediction["estimated_fare"] == 37.2, prediction

        payload["Trip_Distance_km"] = -5
        status, result = call("/predict", payload)
        assert status == 422, (status, result)
        print("Cloud readiness, prediction and invalid-input checks passed")
        PY
    - name: Introduce an intentional version mismatch in staging
      id: deploy
      run: |
        gcloud run services update taxi-fare-staging --project="$PROJECT_ID" --region="$REGION" --update-env-vars=MODEL_VERSION=rollback-demo --quiet
        gcloud run services update-traffic taxi-fare-staging --project="$PROJECT_ID" --region="$REGION" --to-latest --quiet
        echo "url=${{ steps.production_snapshot.outputs.url }}" >> "$GITHUB_OUTPUT"
    - name: Get identity token for service checks
      id: smoke_auth
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ env.PROJECT_ID }}
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.DEPLOY_ACCOUNT }}
        token_format: id_token
        id_token_audience: ${{ steps.deploy.outputs.url }}
        id_token_include_email: true
    - name: Detect the intentional version mismatch
      env:
        TAXI_URL: ${{ steps.deploy.outputs.url }}
        TAXI_TOKEN: ${{ steps.smoke_auth.outputs.id_token }}
      run: |
        python - <<'PY'
        import json
        import os
        from urllib.request import Request, urlopen
        from urllib.error import HTTPError

        def call(path, payload=None):
            headers = {
                "Authorization": "Bearer " + os.environ["TAXI_TOKEN"],
                "Content-Type": "application/json",
            }
            data = None if payload is None else json.dumps(payload).encode()
            request = Request(os.environ["TAXI_URL"] + path,
                              headers=headers, data=data)
            try:
                with urlopen(request, timeout=60) as response:
                    return response.status, json.loads(response.read())
            except HTTPError as error:
                return error.code, json.loads(error.read())

        receipt = json.load(open("reports/registration.json"))
        version = str(receipt["version_id"])
        status, ready = call("/ready")
        assert status == 200, (status, ready)
        assert ready["model_version"] == version, ready

        payload = {
            "Trip_Distance_km": 10.0, "Passenger_Count": 2,
            "Base_Fare": 3.0, "Per_Km_Rate": 1.5,
            "Per_Minute_Rate": 0.3, "Time_of_Day": "Morning",
            "Day_of_Week": "Weekday", "Traffic_Conditions": "Low",
            "Weather": "Clear",
        }
        status, prediction = call("/predict", payload)
        assert status == 200, (status, prediction)
        assert prediction["model_version"] == version, prediction
        assert prediction["estimated_fare"] == 37.2, prediction

        payload["Trip_Distance_km"] = -5
        status, result = call("/predict", payload)
        assert status == 422, (status, result)
        print("Cloud readiness, prediction and invalid-input checks passed")
        PY
    - name: Automatically restore staging after the failed check
      id: production_restore
      if: failure() && steps.production_snapshot.outcome == 'success' && (steps.deploy.outcome == 'success' || steps.deploy.outcome
        == 'failure')
      run: |
        python -m cloudlayer.rollback restore --service=taxi-fare-staging --project="$PROJECT_ID" --region="$REGION" --snapshot=reports/rollback/staging-auto-before.json --report=reports/rollback/staging-auto-restored.json
    - name: Get token to verify restored service
      id: restore_auth
      if: failure() && steps.production_restore.outcome == 'success'
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ env.PROJECT_ID }}
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.DEPLOY_ACCOUNT }}
        token_format: id_token
        id_token_audience: ${{ steps.production_snapshot.outputs.url }}
        id_token_include_email: true
    - name: Verify restored API
      if: failure() && steps.production_restore.outcome == 'success' && steps.restore_auth.outcome == 'success'
      env:
        TAXI_URL: ${{ steps.production_snapshot.outputs.url }}
        TAXI_TOKEN: ${{ steps.restore_auth.outputs.id_token }}
      run: |
        python - <<'PY'
        import json
        import math
        import os
        from pathlib import Path
        from urllib.request import Request, urlopen

        def call(path, payload=None):
            data = None if payload is None else json.dumps(payload).encode()
            request = Request(
                os.environ["TAXI_URL"] + path,
                data=data,
                headers={
                    "Authorization": "Bearer " + os.environ["TAXI_TOKEN"],
                    "Content-Type": "application/json",
                },
            )
            with urlopen(request, timeout=60) as response:
                assert response.status == 200
                return json.loads(response.read())

        ready = call("/ready")
        payload = {
            "Trip_Distance_km": 10.0, "Passenger_Count": 2,
            "Base_Fare": 3.0, "Per_Km_Rate": 1.5,
            "Per_Minute_Rate": 0.3, "Time_of_Day": "Morning",
            "Day_of_Week": "Weekday", "Traffic_Conditions": "Low",
            "Weather": "Clear",
        }
        prediction = call("/predict", payload)
        fare = prediction["estimated_fare"]
        assert isinstance(fare, (int, float)) and not isinstance(fare, bool)
        assert math.isfinite(fare) and fare >= 0
        assert prediction["model_version"] == ready["model_version"]
        Path("reports/rollback/staging-auto-api-restored.json").write_text(
            json.dumps({
                "api_checks_passed": True,
                "ready": ready,
                "prediction": prediction,
            }, indent=2)
        )
        print("Restored API readiness and prediction checks passed")
        PY
    - name: Save automatic rollback drill evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rollback-drill-${{ github.run_id }}
        path: reports/rollback/staging-auto-*.json
    name: Staging automatic rollback drill
